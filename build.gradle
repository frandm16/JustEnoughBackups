plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group
def targetJavaVersion = (project.findProperty("java_version") ?: "25") as int

base {
    archivesName = project.archives_base_name
}

def awsSdkVersion = "2.31.78"
def minecraftNettyVersion = "4.2.16.Final"
def zstdVersion = "1.5.7-3"
def bundledRuntime = configurations.create("bundledRuntime")
bundledRuntime.canBeConsumed = false
bundledRuntime.canBeResolved = true
configurations.implementation.extendsFrom(bundledRuntime)

def isIncludedInMod = { artifact ->
    def id = artifact.moduleVersion.id
    if (id.group == "io.netty" && artifact.name != "netty-codec-http2") return false
    if (id.group == "org.slf4j" && artifact.name == "slf4j-api") return false
    if (id.group == "commons-io" && artifact.name == "commons-io") return false
    if (id.group == "commons-codec" && artifact.name == "commons-codec") return false
    if (id.group == "org.apache.commons" && artifact.name == "commons-lang3") return false
    if (id.group == "org.apache.commons" && artifact.name == "commons-compress") return false
    return true
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }

    withSourcesJar()
}

repositories {
    mavenCentral()
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
        content {
            includeGroup "maven.modrinth"
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    compileOnly "maven.modrinth:modmenu:${modmenu_version}"

    add("bundledRuntime", "org.apache.commons:commons-compress:1.28.0")
    add("bundledRuntime", "com.github.luben:zstd-jni:${zstdVersion}")
    add("bundledRuntime", "software.amazon.awssdk:s3:${awsSdkVersion}") {
        exclude group: "software.amazon.awssdk", module: "apache-client"
        exclude group: "org.apache.httpcomponents"
        exclude group: "commons-logging"
    }
    add("bundledRuntime", "software.amazon.awssdk:netty-nio-client:${awsSdkVersion}")
    add("bundledRuntime", "io.netty:netty-codec-http2:${minecraftNettyVersion}")

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

afterEvaluate {
    configurations.bundledRuntime.resolvedConfiguration.resolvedArtifacts
            .sort { left, right -> left.moduleVersion.id.toString() <=> right.moduleVersion.id.toString() }
            .each { artifact ->
                def id = artifact.moduleVersion.id
                if (isIncludedInMod(artifact)) {
                    dependencies.add("include", "${id.group}:${artifact.name}:${id.version}")
                }
            }
}

test {
    useJUnitPlatform()
    afterTest { descriptor, result ->
        def marker = switch (result.resultType) {
            case org.gradle.api.tasks.testing.TestResult.ResultType.SUCCESS -> "✅"
            case org.gradle.api.tasks.testing.TestResult.ResultType.SKIPPED -> "⏭️"
            default -> "❌"
        }
        logger.lifecycle("${marker} ${descriptor.className} > ${descriptor.displayName}")
    }
    reports {
        html.required = true
        junitXml.required = false
    }
}

tasks.named("processIncludeJars").configure {
    doLast {
        def targetDir = layout.buildDirectory.dir("processIncludeJars").get().asFile
        def zstdJar = new File(targetDir, "zstd-jni-${zstdVersion}.jar")
        if (zstdJar.exists()) {
            def tempJar = new File(targetDir, "zstd-jni-${zstdVersion}-stripped.jar")
            def excludedPrefixes = [
                "aix/", "freebsd/", "win/x86/",
                "linux/arm/", "linux/i386/", "linux/loongarch64/", "linux/mips64/",
                "linux/ppc64/", "linux/ppc64le/", "linux/riscv64/", "linux/s390x/"
            ]
            new java.util.zip.ZipFile(zstdJar).withCloseable { srcZip ->
                new java.util.zip.ZipOutputStream(new FileOutputStream(tempJar)).withCloseable { dstZip ->
                    srcZip.entries().each { entry ->
                        if (!excludedPrefixes.any { entry.name.startsWith(it) }) {
                            dstZip.putNextEntry(new java.util.zip.ZipEntry(entry.name))
                            if (!entry.isDirectory()) {
                                dstZip << srcZip.getInputStream(entry)
                            }
                            dstZip.closeEntry()
                        }
                    }
                }
            }
            java.nio.file.Files.move(tempJar.toPath(), zstdJar.toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
        }
    }
}

tasks.register("verifyAwsSdkPackaging") {
    group = "verification"
    description = "Checks that the distributable mod nests all bundled runtime dependencies."
    dependsOn tasks.named("jar")

    doLast {
        def archive = tasks.named("jar").get().archiveFile.get().asFile
        def archiveZip = new java.util.zip.ZipFile(archive)
        try {
            def metadataEntry = archiveZip.getEntry("fabric.mod.json")
            if (metadataEntry == null) {
                throw new GradleException("${archive.name} has no fabric.mod.json")
            }
            def metadata = new groovy.json.JsonSlurper().parse(archiveZip.getInputStream(metadataEntry))
            def nestedPaths = (metadata.jars ?: []).collect { it.file.toString() } as Set

            configurations.bundledRuntime.resolvedConfiguration.resolvedArtifacts
                    .findAll { isIncludedInMod(it) }
                    .each { artifact ->
                        def id = artifact.moduleVersion.id
                        def expectedPath = "META-INF/jars/${artifact.name}-${id.version}.jar".toString()
                        if (!nestedPaths.contains(expectedPath)) {
                            throw new GradleException("Bundled runtime artifact is missing from fabric.mod.json: ${expectedPath}")
                        }
                        if (archiveZip.getEntry(expectedPath) == null) {
                            throw new GradleException("Bundled runtime jar is missing from ${archive.name}: ${expectedPath}")
                        }
                    }

            configurations.bundledRuntime.resolvedConfiguration.resolvedArtifacts
                    .findAll { !isIncludedInMod(it) }
                    .each { artifact ->
                        def id = artifact.moduleVersion.id
                        def excludedPath = "META-INF/jars/${artifact.name}-${id.version}.jar".toString()
                        if (nestedPaths.contains(excludedPath) || archiveZip.getEntry(excludedPath) != null) {
                            throw new GradleException("Artifact must come from Minecraft or be excluded, not nested jars: ${excludedPath}")
                        }
                    }

            def zstdPath = "META-INF/jars/zstd-jni-${zstdVersion}.jar".toString()
            if (archiveZip.getEntry(zstdPath) != null) {
                def zstdBytes = archiveZip.getInputStream(archiveZip.getEntry(zstdPath)).bytes
                def zstdZip = new java.util.zip.ZipInputStream(new ByteArrayInputStream(zstdBytes))
                try {
                    def hasWinAmd64 = false
                    def hasLinuxAmd64 = false
                    def hasDarwinAarch64 = false
                    for (def entry = zstdZip.nextEntry; entry != null; entry = zstdZip.nextEntry) {
                        if (entry.name.startsWith("aix/") || entry.name.startsWith("win/x86/")) {
                            throw new GradleException("Exotic/32-bit architecture was not stripped from zstd-jni: ${entry.name}")
                        }
                        if (entry.name == "win/amd64/libzstd-jni-${zstdVersion}.dll") hasWinAmd64 = true
                        if (entry.name == "linux/amd64/libzstd-jni-${zstdVersion}.so") hasLinuxAmd64 = true
                        if (entry.name == "darwin/aarch64/libzstd-jni-${zstdVersion}.dylib") hasDarwinAarch64 = true
                    }
                    if (!hasWinAmd64 || !hasLinuxAmd64 || !hasDarwinAarch64) {
                        throw new GradleException("Required 64-bit native libraries missing from zstd-jni")
                    }
                } finally {
                    zstdZip.close()
                }
            }

            def http2Path = "META-INF/jars/netty-codec-http2-${minecraftNettyVersion}.jar".toString()
            if (!nestedPaths.contains(http2Path) || archiveZip.getEntry(http2Path) == null) {
                throw new GradleException("Minecraft-aligned Netty HTTP/2 jar is missing: ${http2Path}")
            }
            def http2Bytes = archiveZip.getInputStream(archiveZip.getEntry(http2Path)).bytes
            def http2Zip = new java.util.zip.ZipInputStream(new ByteArrayInputStream(http2Bytes))
            try {
                def hasHttp2Listener = false
                for (def entry = http2Zip.nextEntry; entry != null; entry = http2Zip.nextEntry) {
                    if (entry.name == 'io/netty/handler/codec/http2/Http2Connection$Listener.class') {
                        hasHttp2Listener = true
                        break
                    }
                }
                if (!hasHttp2Listener) {
                    throw new GradleException('Http2Connection$Listener.class is missing from netty-codec-http2')
                }
            } finally {
                http2Zip.close()
            }

            def authJarEntry = archiveZip.getEntry("META-INF/jars/auth-${awsSdkVersion}.jar")
            if (authJarEntry == null) {
                throw new GradleException("AWS auth SDK jar is missing from ${archive.name}")
            }
            def authBytes = archiveZip.getInputStream(authJarEntry).bytes
            def authZip = new java.util.zip.ZipInputStream(new ByteArrayInputStream(authBytes))
            try {
                def hasAwsCredentials = false
                for (def entry = authZip.nextEntry; entry != null; entry = authZip.nextEntry) {
                    if (entry.name == "software/amazon/awssdk/auth/credentials/AwsCredentials.class") {
                        hasAwsCredentials = true
                        break
                    }
                }
                if (!hasAwsCredentials) {
                    throw new GradleException("AwsCredentials.class is missing from auth-${awsSdkVersion}.jar")
                }
            } finally {
                authZip.close()
            }
            logger.lifecycle("Verified ${archive.name}: bundled dependencies are nested, AwsCredentials and HTTP/2 classes are present, and remaining Netty modules are supplied by Minecraft.")
        } finally {
            archiveZip.close()
        }
    }
}

tasks.named("check") {
    dependsOn tasks.named("verifyAwsSdkPackaging")
}

tasks.withType(JavaCompile).configureEach {
    options.release = targetJavaVersion
}

processResources {
    def props = [
            version                : project.version,
            minecraft_version      : project.minecraft_version,
            minecraft_version_range: project.minecraft_version_range,
            loader_version         : project.loader_version,
            fabric_api_version     : project.fabric_api_version,
            java_version           : project.java_version,
            modmenu_version        : project.modmenu_version
    ]

    inputs.properties(props)

    filesMatching('fabric.mod.json') {
        expand(props)
    }
}
