plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group
def targetJavaVersion = (project.findProperty("java_version") ?: "25") as int

base {
    archivesName = project.archives_base_name
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }

    withSourcesJar()
}

repositories {
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
        content {
            includeGroup "maven.modrinth"
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    compileOnly "maven.modrinth:modmenu:${modmenu_version}"

    implementation "org.apache.commons:commons-compress:1.24.0"
    include "org.apache.commons:commons-compress:1.24.0"

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
    reports {
        html.required = false
        junitXml.required = false
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = targetJavaVersion
}

processResources {
    def props = [
            version                : project.version,
            minecraft_version      : project.minecraft_version,
            minecraft_version_range: project.minecraft_version_range,
            loader_version         : project.loader_version,
            fabric_api_version     : project.fabric_api_version,
            java_version           : project.java_version,
            modmenu_version        : project.modmenu_version
    ]

    inputs.properties(props)

    filesMatching('fabric.mod.json') {
        expand(props)
    }
}