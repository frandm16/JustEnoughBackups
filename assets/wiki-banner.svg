<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="156" viewBox="0 0 1200 156" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Just Enough Backups documentation wiki</title>
  <desc id="desc">A link to the new JEB documentation with setup, command, configuration, storage, and restore guides.</desc>
  <defs>
